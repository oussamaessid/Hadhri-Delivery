services:
  admin:
    build: .
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:80"
    depends_on:
      - backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-hadhri}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@database:3306/${MYSQL_DATABASE:-hadhri}
      DATABASE_AUTO_CREATE: "false"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      API_HOST: 0.0.0.0
      APP_ORIGIN: http://localhost:${ADMIN_PORT:-8080}
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hadhri}
      MYSQL_USER: ${MYSQL_USER:-hadhri}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
