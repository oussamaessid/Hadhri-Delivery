services:
  admin:
    build: .
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:80"
    depends_on:
      - backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-hadhri}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@database:3306/${MYSQL_DATABASE:-hadhri}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      API_HOST: 0.0.0.0
      APP_ORIGIN: http://localhost:${ADMIN_PORT:-8080}
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-hadhri}
      MARIADB_USER: ${MYSQL_USER:-hadhri}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  mysql_data:
