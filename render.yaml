services:
  - type: web
    name: hadhri-delivery
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile.render
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "10000"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_AUTO_CREATE
        value: "false"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: APP_ORIGIN
        sync: false
