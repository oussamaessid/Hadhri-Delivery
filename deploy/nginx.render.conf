server {
 listen 10000;
 server_name _;
 root /app/public-site;
 index index.html;
 client_max_body_size 2m;
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_comp_level 5;
 gzip_types application/json application/javascript text/css image/svg+xml;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location ~ ^/(api-docs|swagger|openapi) { return 404; }
 location / { try_files $uri $uri.html $uri/ =404; }
 # Hashed build files never change: browsers keep them for a year. Images for a week.
 location /_next/static/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
  try_files $uri =404;
 }
 # The service worker must be revalidated on every load so updates reach browsers.
 location = /sw.js {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  try_files $uri =404;
 }
 location /images/ {
  add_header Cache-Control "public, max-age=604800" always;
  add_header X-Content-Type-Options nosniff always;
  try_files $uri =404;
 }
 location /api/ {
  proxy_pass http://127.0.0.1:3001;
  proxy_set_header Host $http_host;
  proxy_http_version 1.1;

  proxy_set_header Connection "";
  proxy_read_timeout 120s;
 }
}
