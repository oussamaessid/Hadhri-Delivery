# Single VPS (OVH, Contabo…): same image as Render, behind Caddy for automatic HTTPS, with its own MySQL.
# A new database starts empty: no products, rayons, restaurants or drivers; the admin password is set on first visit.
# Usage: docker compose -f docker-compose.vps.yml --env-file .env.vps up -d --build
services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.render
    restart: unless-stopped
    env_file: .env.vps
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.vps}
      DATABASE_URL: mysql://hadhri:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.vps}@database:3306/hadhri
      DATABASE_SSL: "false"
      DATABASE_AUTO_CREATE: "false"
    volumes:
      - app_data:/app/.data
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hadhri
      MYSQL_USER: hadhri
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.vps}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.vps}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -uhadhri -D hadhri -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.vps}
    volumes:
      - ./deploy/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  app_data:
  mysql_data:
  caddy_data:
  caddy_config:
